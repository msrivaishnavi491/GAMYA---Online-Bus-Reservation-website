<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add or update schedule | GAMYA</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><header class="topbar"><a class="brand" href="index.html">GAM<b>YA</b><small>TRAVEL • CONNECT • DISCOVER</small></a><button class="menu" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button><nav class="nav"><a href="index.html">Overview</a><a href="buses.html">Buses</a><a href="passengers.html">Passengers</a><a href="bookings.html">Bookings</a><a href="add-bus.html">Add Schedule</a><a href="reserve.html">Reserve Seat</a></nav></header><main class="wrap">
<section class="page-head"><div><span class="eyebrow">ADMIN WORKSPACE</span><h2 id="formTitle">Add a bus schedule</h2><p>Create a route or update the details of an existing bus.</p></div><img src="https://i.pinimg.com/1200x/3f/cc/8c/3fcc8c10eb2c1ef177556c802655c6e6.jpg" alt="Bus seats and interior"></section>
<div class="panel"><form id="busForm" class="form-grid"><div class="field"><label>Bus number</label><input name="bus_no" required placeholder="e.g. GAMYA-404"></div><div class="field"><label>Departure time</label><input name="departure_time" type="time" required></div><div class="field"><label>Source city</label><input name="source" required placeholder="Starting city"></div><div class="field"><label>Destination city</label><input name="destination" required placeholder="Destination city"></div><div class="field"><label>Total seats</label><input name="total_seats" type="number" min="1" required></div><div class="field"><label>Available seats</label><input name="available_seats" type="number" min="0" required></div><div class="full actions"><button class="btn" type="submit">Save schedule</button><a class="btn secondary" href="buses.html">View buses</a></div></form><div id="notice" class="notice"></div></div>
</main><footer class="footer"><strong>GAMYA · Online Bus Reservation</strong><span>Travel with comfort. Manage with confidence.</span><span>© 2026 GAMYA</span></footer></body></html>
